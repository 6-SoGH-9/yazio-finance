<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAZIO Finance Cockpit</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6d67;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.05);
  --s1:#1f3d63; --s2:#d98a3d; --s3:#5f8fc7; --s4:#8a93a0; --good:#0ca30c; --goodtxt:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --crittxt:#a52a2a; --warntxt:#7a5200;
  --accent:#184f95;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  color-scheme:dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#a09e96;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.07);
  --s1:#6a9bd6; --s2:#e39b52; --s3:#b3cdec; --s4:#9aa3b0; --goodtxt:#0ca30c; --crittxt:#ff8a8a; --warntxt:#fab219; --accent:#86b6ef;}}
:root[data-theme="dark"]{
  color-scheme:dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#a09e96;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.07);
  --s1:#6a9bd6; --s2:#e39b52; --s3:#b3cdec; --s4:#9aa3b0; --goodtxt:#0ca30c; --crittxt:#ff8a8a; --warntxt:#fab219; --accent:#86b6ef;}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--border)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 0 8px}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
h1 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab,.btn,select,.chip{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.tab:hover:not([aria-selected="true"]),.btn:hover,.chip:hover{background:var(--wash)}
.chip{padding:3px 10px;font-size:12.5px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--page);border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:8px 0 12px;color:var(--ink2);font-size:13px}
.filters label{display:flex;gap:6px;align-items:center}
main{padding:16px 0 60px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
@media (max-width:480px){.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{font-size:14px;margin:0 0 2px;font-weight:650}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.kpi .v{font-size:26px;font-weight:650;line-height:1.15}
.kpi .l{color:var(--ink2);font-size:12.5px}
.kpi .d{font-size:12.5px;margin-top:2px}
.up{color:var(--goodtxt)}.down{color:var(--crittxt)}
h3.sec{margin:26px 0 10px;font-size:15px;font-weight:650}
.note{border-left:3px solid var(--s1);background:var(--wash);padding:8px 12px;border-radius:0 8px 8px 0;color:var(--ink2);font-size:13px;margin:10px 0}
.note.warn{border-color:var(--warn)}.note.crit{border-color:var(--crit)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{font-weight:650;background:var(--wash)}
.scroll{overflow-x:auto}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--border);white-space:nowrap}
.tag.good{color:var(--goodtxt)}.tag.warn{color:var(--warntxt)}.tag.crit{color:var(--crittxt)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chartbtn{float:right;font-size:12px;padding:2px 8px}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
svg .lbl{fill:var(--ink2)}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 18px rgba(0,0,0,.18);display:none;max-width:260px}
#tip b{font-weight:650}#tip .r{display:flex;gap:8px;align-items:center;justify-content:space-between}
#tip .k{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px}
input[type=range]{width:150px;accent-color:var(--s1)}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:13px}
.slider .val{font-variant-numeric:tabular-nums;font-weight:600}
.slider input{grid-column:1/3;width:100%}
ul.clean{margin:6px 0 0;padding-left:18px}ul.clean li{margin:4px 0}
details{border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
.small{font-size:12.5px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(150px,1.4fr) 3fr 64px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hbar .track{position:relative;height:14px;background:var(--wash);border-radius:4px}
.hbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.hbar .num{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
@media (max-width:560px){.hbar{grid-template-columns:1fr 64px}.hbar .track{grid-column:1/3;order:3}}
.stale{display:inline-block;font-size:11px;border:1px dashed var(--warn);color:var(--warntxt);border-radius:999px;padding:0 8px;margin-left:6px}
footer{color:var(--muted);font-size:12px;padding:20px 0 40px}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="top">
   <h1>YAZIO finance cockpit<small id="asof"></small></h1>
   <div class="tabs" role="tablist" id="tabs"></div>
   <span><a href="index.html">Home</a> <button class="btn" id="theme" aria-label="Toggle light or dark theme">Theme</button></span>
  </div>
  <div class="filters" id="filters"></div>
 </div>
</header>
<section class="wrap" id="datawrap"><button class="btn" id="datatoggle" aria-expanded="false" style="margin:10px 0 0"></button><div id="datapanel" hidden style="margin-top:10px"></div></section>
<main class="wrap" id="main"></main>
<footer class="wrap">
 Sources: YAZIO GmbH annual financial statements (HGB, Unternehmensregister extracts).
 All statement figures come from the statements you add above (kept in this browser), or from data/years.js when none are added.
</footer>
<div id="tip"></div>

<script src="js/vendor/pdf.min.js"></script>
<script src="data/years.js"></script>
<script src="js/calc.js"></script>
<script src="js/views-more.js"></script>
<script src="js/extract-core.js"></script>
<script src="js/store.js"></script>
<script>
"use strict";
var CALC=window.YAZIO_CALC,fm=CALC.fmt;
var qs=new URLSearchParams(location.search);
var DS=window.YAZIO_STORE.init(window.YAZIO_DATA);
window.YAZIO_STORE.mount(document.getElementById("datapanel"),DS);
(function(){var pnl=document.getElementById("datapanel"),btn=document.getElementById("datatoggle"),key="yazio.panel.open",open=!DS.data;
  try{if(sessionStorage.getItem(key)==="1")open=true;}catch(e){}
  var n=DS.years?DS.years.length:0,own=DS.source==="stored";
  var set=function(o){open=o;pnl.hidden=!o;btn.setAttribute("aria-expanded",String(o));btn.textContent=(o?"▾ ":"▸ ")+"Add or manage statements"+(n?" · "+n+" year"+(n>1?"s":"")+(own?" (your PDFs)":" (example data)"):"");try{sessionStorage.setItem(key,o?"1":"0");}catch(e){}};
  btn.onclick=function(){set(!open);};set(open);})();
if(!DS.data){document.getElementById("asof").textContent="";throw new Error("no data yet");}
var LD=CALC.load(DS.data,{from:+qs.get("from")||0,to:+qs.get("to")||0});
var Y=LD.years,N=Y.length;
var $=function(s){return document.querySelector(s)};
if(!N){throw new Error("no data");}

/* ---------- helpers ---------- */
var h=function(tag,props){var e=document.createElement(tag),kids=Array.prototype.slice.call(arguments,2);
  for(var k in(props||{})){if(k==="class")e.className=props[k];else if(k.indexOf("on")===0)e.addEventListener(k.slice(2),props[k]);else if(k==="style")e.style.cssText=props[k];else e.setAttribute(k,props[k]);}
  [].concat.apply([],kids).forEach(function(c){if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});return e;};
var NS="http://www.w3.org/2000/svg";
var s=function(tag,props){var e=document.createElementNS(NS,tag),kids=Array.prototype.slice.call(arguments,2);for(var k in(props||{}))e.setAttribute(k,props[k]);[].concat.apply([],kids).forEach(function(c){if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));});return e;};
var m1=function(x){return x==null?"n/a":(x/1e6).toFixed(1)};
var em=fm.em;
var eur=fm.eur;
var eur2=function(x){return (x<0?"−":"")+"€"+Math.abs(x).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})};
var pc=function(x,d){return x==null||!isFinite(x)?"n/a":(x>=0?"+":"−")+Math.abs(x*100).toFixed(d==null?1:d)+"%"};
var pl=function(x,d){return x==null||!isFinite(x)?"n/a":(x*100).toFixed(d==null?1:d)+"%"};
var delta=function(x){var c=x==null?"":(x>=0?"up":"down");return h("span",{class:c},x==null?"":(x>=0?"▲ ":"▼ ")+Math.abs(x*100).toFixed(1)+"% vs prior year");};
var tipEl=$("#tip");
function showTip(ev,title,rows){tipEl.replaceChildren(h("b",{},title),...rows.map(function(r){return h("div",{class:"r"},h("span",{},r.c?h("span",{class:"k",style:"background:"+r.c}):"",r.n),h("b",{},r.v))}));
  tipEl.style.display="block";var w=tipEl.offsetWidth,hh=tipEl.offsetHeight,x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+hh>innerHeight-8)y=ev.clientY-hh-14;tipEl.style.left=x+"px";tipEl.style.top=y+"px";}
var hideTip=function(){tipEl.style.display="none"};
var nice=function(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;};

function chartCard(title,sub,spec){
  var card=h("div",{class:"card"}),btn=h("button",{class:"btn chartbtn"},"Table"),body=h("div",{}),showT=false;
  var draw=function(){body.replaceChildren(showT?tableView(spec):plot(spec));btn.textContent=showT?"Chart":"Table";};
  btn.onclick=function(){showT=!showT;draw();};
  card.append(btn,h("h2",{},title),h("p",{class:"sub"},sub||""),body);draw();return card;
}
function tableView(sp){
  return h("div",{class:"scroll"},h("table",{},h("thead",{},h("tr",{},h("th",{},"Period"),...sp.series.map(function(x){return h("th",{class:"n"},x.name)}))),
   h("tbody",{},...sp.cats.map(function(c,i){return h("tr",{},h("td",{},c),...sp.series.map(function(x){return h("td",{class:"n"},x.values[i]==null?"n/a":sp.fmt(x.values[i]))}))}))));
}
function plot(sp){
  var W=Math.min(620,Math.max(300,innerWidth-64)),H=sp.height||250,ml=48,mr=14,mt=12,mb=26,wrap=h("div",{});
  if(sp.series.length>1)wrap.append(h("div",{class:"legend"},...sp.series.map(function(x){return h("span",{},h("i",{style:"background:"+x.color+(sp.type==="line"?";height:3px;vertical-align:3px":"")}),x.name)})));
  var all=[].concat.apply([],sp.series.map(function(x){return x.values.filter(function(v){return v!=null})}));
  var mx=Math.max.apply(null,[0].concat(all)),mn=Math.min.apply(null,[0].concat(all));
  var step=nice((mx-mn)*1.08/4||1);mx=Math.ceil(mx/step)*step;mn=mn<0?Math.floor(mn/step)*step:0;if(mx===mn)mx=mn+step;
  var iw=W-ml-mr,ih=H-mt-mb,y=function(v){return mt+ih*(1-(v-mn)/(mx-mn))},band=iw/sp.cats.length;
  var svg=s("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",role:"img","aria-label":sp.title||"chart"});
  for(var v=mn;v<=mx+1e-9;v+=step){svg.append(s("line",{x1:ml,x2:W-mr,y1:y(v),y2:y(v),stroke:v===0?"var(--axis)":"var(--grid)","stroke-width":1}),s("text",{x:ml-6,y:y(v)+4,"text-anchor":"end"},sp.axis?sp.axis(v):sp.fmt(v)));}
  var n=sp.series.length,bw=Math.min(30,(band*.7-(n-1)*2)/n);
  sp.cats.forEach(function(c,i){svg.append(s("text",{x:ml+band*i+band/2,y:H-8,"text-anchor":"middle"},c));});
  if(sp.type==="line"){
    sp.series.forEach(function(x){var d="";x.values.forEach(function(v,i){if(v==null)return;d+=(d?"L":"M")+(ml+band*i+band/2)+","+y(v);});
      svg.append(s("path",{d:d,fill:"none",stroke:x.color,"stroke-width":2,"stroke-linejoin":"round"}));
      x.values.forEach(function(v,i){if(v==null)return;svg.append(s("circle",{cx:ml+band*i+band/2,cy:y(v),r:4,fill:x.color,stroke:"var(--surface)","stroke-width":2}));});
      var li=x.values.map(function(v){return v!=null}).lastIndexOf(true);if(li>=0&&sp.series.length<=4)svg.append(s("text",{class:"lbl",x:ml+band*li+band/2,y:y(x.values[li])-9,"text-anchor":"middle"},sp.fmt(x.values[li])));});
  }else{
    sp.series.forEach(function(x,k){x.values.forEach(function(v,i){if(v==null)return;var x0=ml+band*i+band/2-(n*bw+(n-1)*2)/2+k*(bw+2);
      var top=v>=0?y(v):y(0),hh=Math.max(1,Math.abs(y(v)-y(0)));
      svg.append(s("rect",{x:x0,y:top,width:bw,height:hh,fill:x.color,rx:3}));
      if(sp.labels&&n===1)svg.append(s("text",{class:"lbl",x:x0+bw/2,y:v>=0?top-4:top+hh+11,"text-anchor":"middle"},sp.fmt(v)));});});
  }
  var cross=s("line",{y1:mt,y2:mt+ih,stroke:"var(--axis)","stroke-width":1,style:"display:none"});svg.append(cross);
  sp.cats.forEach(function(c,i){var r=s("rect",{x:ml+band*i,y:mt,width:band,height:ih+mb,fill:"transparent",tabindex:0,"aria-label":c+": "+sp.series.map(function(x){return x.name+" "+(x.values[i]==null?"n/a":sp.fmt(x.values[i]))}).join(", ")});
    var on=function(ev){cross.setAttribute("x1",ml+band*i+band/2);cross.setAttribute("x2",ml+band*i+band/2);cross.style.display="";var b=r.getBoundingClientRect();showTip(ev.clientX?ev:{clientX:b.left+b.width/2,clientY:b.top+20},c,sp.series.map(function(x){return {c:x.color,n:x.name,v:x.values[i]==null?"n/a":sp.fmt(x.values[i])}}));};
    r.addEventListener("pointermove",on);r.addEventListener("focus",on);r.addEventListener("pointerleave",function(){hideTip();cross.style.display="none"});r.addEventListener("blur",function(){hideTip();cross.style.display="none"});svg.append(r);});
  wrap.append(svg);return wrap;
}
function hbars(rows,max,color){
  return h("div",{},...rows.map(function(r){return h("div",{},h("div",{class:"hbar"},h("div",{},r.n),h("div",{class:"track"},h("div",{class:"fill",style:"width:"+Math.max(0,Math.min(100,r.v/max*100))+"%;background:"+(r.c||color||"var(--s1)")})),h("div",{class:"num"},pc(r.v,1))),r.note?h("div",{class:"small",style:"margin:-3px 0 8px"},r.note):null)}));
}
var kpi=function(l,v,d,extra){return h("div",{class:"card kpi"},h("div",{class:"l"},l),h("div",{class:"v"},v),h("div",{class:"d"},d||""),extra||"")};
var tag=function(t,c){return h("span",{class:"tag "+c},({good:"✓ ",warn:"! ",crit:"✕ "})[c]||"",t)};
var sevTag=function(x){return tag(x,x==="High"?"crit":x==="Medium"?"warn":"good")};
var stTag=function(x){return tag(x,x==="Done"?"good":"crit")};
function slider(label,min,max,stp,val,f,onc){
  var out=h("span",{class:"val"},f(val)),inp=h("input",{type:"range",min:min,max:max,step:stp,value:val,"aria-label":label});
  inp.addEventListener("input",function(){out.textContent=f(+inp.value);onc(+inp.value);});
  return h("div",{class:"slider"},h("span",{},label),out,inp);
}

/* ---------- state and data accessors ---------- */
var FY=Y.map(function(c){return c.fy});
var st={role:"overview",from:FY[0],to:FY[N-1],basis:"comparable",gy:null,bridgeY:FY[N-1],ctrlFilter:"All",rebate:false,preM:5,preType:"All",obsSev:"All",sc:null};
var idx=function(){return Y.map(function(c,i){return i}).filter(function(i){return FY[i]>=st.from&&FY[i]<=st.to})};
var cats=function(){return idx().map(function(i){return Y[i].short})};
var gpB=function(c){return st.basis==="comparable"?c.gp:c.gp_filed};
var opexB=function(c){return st.basis==="comparable"?c.opex:c.opex_filed};     // negative numbers
var gpGrowthB=function(i){return i>0?gpB(Y[i])/gpB(Y[i-1])-1:null};
var cover=function(c){return (c.cash+c.sec)/c.di};
var curYear=function(){return Y[idx().slice(-1)[0]]};

/* ---------- filter bar ---------- */
var BASISNOTE="Gross profit (Rohergebnis), basis: comparable, app-store fees in other operating expenses in every year.";
function buildFilters(){
  var f=$("#filters");f.replaceChildren();
  var sel=function(v,onc){var e=h("select",{},...FY.map(function(o){return h("option",{value:o},o)}));e.value=v;e.onchange=function(){onc(+e.value)};return e;};
  if(st.role==="overview"){f.append(h("span",{class:"small"},"Pick the fiscal year inside the page. "+BASISNOTE));}
  else if(st.role==="analysis"||st.role==="data"){
    f.append(h("label",{},"From FY",sel(st.from,function(v){st.from=Math.min(v,st.to);render();})),h("label",{},"To FY",sel(st.to,function(v){st.to=Math.max(v,st.from);render();})));
    if(st.role==="data"){f.append(h("span",{class:"small"},BASISNOTE));return;}
    var b=h("button",{class:"chip","aria-pressed":st.basis==="comparable",title:"Until FY2021 the app-store fees were netted inside gross profit; from FY2022 they are in other operating expenses. Comparable basis adds them back for the earlier years. EBIT and net income do not change."},st.basis==="comparable"?"Comparable (fees in other opex)":"As filed");
    b.onclick=function(){st.basis=st.basis==="comparable"?"filed":"comparable";render();};f.append(h("label",{},"Basis",b));
  }
}

/* ---------- CFO ---------- */
function riskBlock(){
  var root=h("div",{});
  /* outlook from the report of the latest year that states one */
  var ov=null;Y.slice().reverse().some(function(c){if(c.raw.outlook&&(c.raw.outlook.bookings_growth_text||c.raw.outlook.bookings_growth_pct!=null)){ov=c;return true}});
  var lbk=Y.filter(function(c){return c.bookings!=null}).slice(-2);
  var feeLine=lbk.length===2?"Transaction cost rate on bookings moved from "+pl(lbk[0].fees/lbk[0].bookings)+" to "+pl(lbk[1].fees/lbk[1].bookings)+" in "+lbk[1].label+" (inference from rounded figures; mix or tier changes are one possible cause).":"";
  root.append(h("div",{class:"grid g2"},
    h("div",{class:"card"},h("h2",{},"Risk ratings",h("span",{class:"stale"},"FY2024 report")),h("table",{},h("tbody",{},
      h("tr",{},h("td",{},"AI and competition (earnings)"),h("td",{},tag("High","crit"))),
      h("tr",{},h("td",{},"Fair-consumer-contracts law, cancellation button"),h("td",{},tag("Low (no effect seen yet)","good"))),
      h("tr",{},h("td",{},"Platform outages"),h("td",{},tag("Medium","warn"))),
      h("tr",{},h("td",{},"App-store fee increases"),h("td",{},tag("Relatively low","good"))))),
      h("p",{class:"small"},feeLine)),
    h("div",{class:"card"},h("h2",{},"Outlook"),h("ul",{class:"clean"},
      ov?h("li",{},ov.raw.outlook.report+": bookings growth "+(ov.raw.outlook.bookings_growth_text||(ov.raw.outlook.bookings_growth_pct+"%"))+" for "+(ov.fy+1)+"."):h("li",{},"No outlook stated in the loaded years."),
